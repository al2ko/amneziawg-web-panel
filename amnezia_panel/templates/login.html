{% extends "base.html" %}
{% block title %}Вход — AmneziaWG{% endblock %}
{% block shell %}
<main class="login-wrap">
  <section class="login-card">
    <div class="login-logo">A</div><h1>Вход в панель</h1><p>Управление сервером AmneziaWG</p>
    {% for category, message in get_flashed_messages(with_categories=true) %}<div class="alert {{ category }}">{{ message }}</div>{% endfor %}
    <form method="post" class="stack">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label>Логин<input name="username" autocomplete="username" required autofocus></label>
      <label>Пароль<input type="password" name="password" autocomplete="current-password" required></label>
      <button class="primary" type="submit">Войти</button>
    </form>
  </section>
</main>
{% endblock %}
