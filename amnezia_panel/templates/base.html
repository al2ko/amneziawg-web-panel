<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}AmneziaWG{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='preview.css') }}">
</head>
<body>
  {% block shell %}
  <header class="topbar">
    <a class="brand" href="{{ url_for('dashboard') }}"><span class="brand-mark">A</span> AmneziaWG</a>
    <nav><a href="{{ url_for('audit_log') }}">Журнал</a><a href="{{ url_for('backup') }}">Резервная копия</a>
      <form method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="link-button">Выйти</button></form>
    </nav>
  </header>
  <main class="container">
    {% for category, message in get_flashed_messages(with_categories=true) %}<div class="alert {{ category }}">{{ message }}</div>{% endfor %}
    {% block content %}{% endblock %}
  </main>
  {% endblock %}
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>
